<div class="login-container">
  <div class="login-card">
    <h2>Bienvenido de nuevo</h2>
    <p class="subtitle">Ingresa tus datos para continuar</p>

    <form [formGroup]="formLogin" (ngSubmit)="iniciarSesion()">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input formControlName="email" type="email"
          
          id="email" 
          name="email" 
          placeholder="tu@correo.com" 
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          name="password" 
          placeholder="••••••••" 
          required
        >
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox" formControlName="rememberMe" name="rememberMe"> Recordarme
        </label>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="login-failed" *ngIf="!isLogin">
        <strong> 
          <p>Login Incorrecto</p>
        </strong>
      </div><br>
      <button type="submit" class="btn-submit" >Iniciar Sesión</button>
      
    </form>
  </div>
</div>
